name: Mobile app - build & publish APK

# Builds two Android APKs for apps/mobile via a local Gradle build — a
# universal one (all ABIs) and a small one (arm64-v8a only, R8-minified) —
# from one expo prebuild (the native android/ project is gitignored — see
# apps/mobile/.gitignore and docs/12-mobile-app.md). No EAS account/token is
# needed: the release build type is signed with the RN template's debug
# keystore, same as running `expo prebuild && ./gradlew assembleRelease`
# locally, so this is meant for internal distribution/testing, not the Play
# Store.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/api-client/**"
      - "packages/types/**"
      - "packages/ordering/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write # to create the GitHub Release and upload the APK asset

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # apps/mobile depends on the compiled dist/ of these workspace
      # packages at runtime — see "Workspace package build order" in
      # CLAUDE.md. Build order matters: @app/api-client depends on
      # @app/types.
      - name: Build shared packages
        working-directory: .
        run: |
          pnpm --filter @app/ordering build
          pnpm --filter @app/types build
          pnpm --filter @app/api-client build

      - name: Read app version
        id: app-version
        run: echo "version=$(jq -r .expo.version app.json)" >> "$GITHUB_OUTPUT"

      # app.json points `android.googleServicesFile` at this, and the file is
      # gitignored (it is Firebase project config, not source), so prebuild
      # cannot run without it being written here first. Failing with a readable
      # message beats prebuild's own cryptic error about a missing file.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing the GOOGLE_SERVICES_JSON repository secret. Paste the contents of apps/mobile/google-services.json into Settings → Secrets and variables → Actions. See apps/mobile/CHEATSHEET.md §6."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

      # prebuild writes -XX:MaxMetaspaceSize=512m, which is not enough for the
      # KSP/annotation-processing load once expo-notifications and the Firebase
      # Gradle plugin are in the build — the JVM dies with
      # "OutOfMemoryError: Metaspace" partway through :expo-updates:kspReleaseKotlin.
      # android/ is regenerated on every run, so this has to be re-applied here
      # rather than committed.
      - name: Raise Gradle JVM memory
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m/' android/gradle.properties
          grep '^org.gradle.jvmargs=' android/gradle.properties

      # Must run after prebuild since android/ is gitignored (regenerated
      # each run) and hashFiles needs it to exist to key the cache.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Name APKs
        id: apk
        run: |
          BASE="tasks-follow-system-v${{ steps.app-version.outputs.version }}-${{ github.run_number }}"
          echo "universal=$BASE-universal.apk" >> "$GITHUB_OUTPUT"
          echo "arm64=$BASE-arm64.apk" >> "$GITHUB_OUTPUT"

      # Two APKs from the one android/ project. Both builds write the same
      # app-release.apk, so each is copied out under its final name before the
      # next build overwrites it. The second build reuses most of the first
      # build's work (the arm64 native libs are already compiled).
      - name: Build universal APK (all ABIs, no minification)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../${{ steps.apk.outputs.universal }}"
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

      # The small APK: one ABI instead of the four prebuild defaults to in
      # reactNativeArchitectures (native libs dominate APK size), plus R8 and
      # resource shrinking, which prebuild leaves off. Passed as -P overrides
      # rather than edits to gradle.properties / app/build.gradle because
      # android/ is regenerated on every run. arm64-v8a covers every 64-bit
      # ARM device; 32-bit-only phones need the universal APK.
      - name: Build small APK (arm64-v8a, R8 + resource shrinking)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/apk/release/app-release.apk "../${{ steps.apk.outputs.arm64 }}"
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.universal }}
          path: apps/mobile/${{ steps.apk.outputs.universal }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.arm64 }}
          path: apps/mobile/${{ steps.apk.outputs.arm64 }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.app-version.outputs.version }}-${{ github.run_number }}
          name: Mobile v${{ steps.app-version.outputs.version }} (build ${{ github.run_number }})
          files: |
            apps/mobile/${{ steps.apk.outputs.universal }}
            apps/mobile/${{ steps.apk.outputs.arm64 }}
          body: |
            - `*-arm64.apk` — الأصغر حجمًا؛ يعمل على كل أجهزة ARM 64-بت (معظم الهواتف منذ نحو 2017). جرّب هذا أولًا.
            - `*-universal.apk` — كل المعماريات؛ للأجهزة القديمة 32-بت التي يرفض الملف الأول التثبيت عليها.
          generate_release_notes: false
